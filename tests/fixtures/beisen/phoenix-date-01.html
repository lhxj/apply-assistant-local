<div class="form-item form-item--phoenix">
  <div class="form-item__title"><span class="form-item__text">* 开始时间</span></div>
  <div class="form-item__control">
    <div class="phoenix-select phoenix-select--active">
      <input class="phoenix-select__input phoenix-select__input--unText" value="">
      <div class="phoenix-select__placeHolder">请选择</div>
    </div>
  </div>
</div>
<div class="phoenix-date-picker__wrap">
  <div class="phoenix-calendar-month-panel">
    <a class="phoenix-calendar-month-panel-year-select" role="button">2024</a>
    <table class="phoenix-calendar-month-panel-table" role="grid">
      <tbody>
        <tr><td class="phoenix-calendar-month-panel-cell" role="gridcell"><a class="phoenix-calendar-month-panel-month">9月</a></td></tr>
      </tbody>
    </table>
  </div>
</div>
